<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My 3MF models</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--line:#e2e2e0;--accent:#00ae42;--imgbg:#ebe9e5;--shadow:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--text:#ececee;--muted:#9a9aa2;--line:#2e2e33;--accent:#2fd36b;--imgbg:#2a2a2f;--shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;display:flex;align-items:center;gap:8px}
h1 span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
#count{color:var(--muted);margin-right:auto}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
#q{flex:1 1 260px;min-width:180px;max-width:480px}
.sub{padding:6px 20px 0;color:var(--muted);font-size:12px}
main{padding:16px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,220px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--shadow)}
.thumb{aspect-ratio:1;background:var(--imgbg);position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;padding:10px;text-align:center}
.badges{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.badge{background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.badge.g{background:var(--accent);color:#000}
.info{padding:10px 12px 12px}
.title{font-weight:600;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.file{font:11.5px Consolas,monospace;color:var(--muted);word-break:break-all;margin-bottom:5px}
.meta{font-size:12px;color:var(--muted)}
#empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}
/* details view */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:10}
#lb.on{display:flex}
#lbImgWrap{flex:1;display:flex;flex-direction:column;min-width:0}
#lbMain{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:20px}
#lbMain img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:0;font-size:28px;width:48px;height:64px;border-radius:10px}
.nav:hover{background:rgba(255,255,255,.25)}
#prev{left:12px}#next{right:12px}
#strip{display:flex;gap:8px;padding:10px 20px 16px;overflow-x:auto}
#strip figure{margin:0;flex:0 0 auto;text-align:center;color:#ccc;font-size:11px;cursor:pointer}
#strip img{width:84px;height:84px;object-fit:contain;background:var(--imgbg);border-radius:6px;border:2px solid transparent;display:block}
#strip figure.cur img{border-color:var(--accent)}
#lbPanel{width:360px;background:var(--card);color:var(--text);padding:20px;overflow:auto;position:relative}
#lbPanel h2{font-size:18px;margin:0 30px 6px 0}
#lbPanel .row{margin:8px 0;font-size:13px}
#lbPanel .k{color:var(--muted)}
#lbPanel .path{font:12px Consolas,monospace;word-break:break-all;background:var(--imgbg);padding:8px;border-radius:6px}
#lbPanel .desc{font-size:13px;white-space:pre-wrap;color:var(--text);opacity:.9}
#lbPanel .btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#lbPanel button.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
#lbPanel button.danger{color:#e5484d;border-color:#e5484d55}
#lbPanel button.danger:hover{background:#e5484d;color:#fff;border-color:#e5484d}
#lbPanel .hint{font-size:11.5px;color:var(--muted);margin:-4px 0 12px}
#close{position:absolute;top:12px;right:12px;border:0;background:none;font-size:22px;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:8px 16px;border-radius:8px;display:none;z-index:20}
@media (max-width:800px){#lb.on{flex-direction:column}#lbPanel{width:auto;max-height:45vh}.nav{width:36px;height:48px}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>My 3MF models</h1>
  <span id="count"></span>
  <input id="q" type="search" placeholder="Search: file name, title, designer, description…" autofocus>
  <select id="dir"></select>
  <select id="sort">
    <option value="name">Sort: file name</option>
    <option value="title">Sort: title</option>
    <option value="new">Sort: newest</option>
    <option value="old">Sort: oldest</option>
    <option value="big">Sort: largest</option>
  </select>
  <select id="size" title="Tile size">
    <option value="160">Small</option>
    <option value="220" selected>Medium</option>
    <option value="320">Large</option>
  </select>
</header>
<div class="sub">Folder: __FOLDER__ · generated __GEN__ · added new files? Run Refresh Gallery.bat again</div>
<main id="grid"></main>

<div id="lb">
  <div id="lbImgWrap">
    <div id="lbMain">
      <button class="nav" id="prev" title="Previous picture (←)">‹</button>
      <img id="lbImg" alt="">
      <button class="nav" id="next" title="Next picture (→)">›</button>
    </div>
    <div id="strip"></div>
  </div>
  <div id="lbPanel"></div>
</div>
<div id="toast"></div>

<script>
const DATA = __DATA__;
const ROOT = __ROOT_JSON__;
const PREFIX = __PREFIX_JSON__;
const GAL = __OUTDIR_JSON__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const relHref = p => PREFIX + p.split('\\').map(encodeURIComponent).join('/');
const fullPath = d => ROOT + '\\' + d.file;
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
DATA.forEach((d, i) => { d.i = i; d.hay = [d.title, d.name, d.designer, d.profile, d.desc, d.dir].join(' ').toLowerCase(); });

// subfolder list
const dirs = [...new Set(DATA.map(d => d.dir))].sort((a, b) => a.localeCompare(b));
$('#dir').innerHTML = '<option value="*">All folders</option>' +
  dirs.map(d => `<option value="${esc(d)}">${d ? esc(d) : '(top folder)'}</option>`).join('');
if (dirs.length < 2) $('#dir').style.display = 'none';

try { const s = localStorage.getItem('g3mf_size'); if (s) $('#size').value = s;
      const o = localStorage.getItem('g3mf_sort'); if (o) $('#sort').value = o; } catch (e) {}

function render() {
  const words = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const dir = $('#dir').value, sort = $('#sort').value;
  const all = DATA.filter(d => !DELETED.has(fullPath(d)));
  let list = all.filter(d => (dir === '*' || d.dir === dir) && words.every(w => d.hay.includes(w)));
  const cmp = {
    name:  (a, b) => a.file.localeCompare(b.file),
    title: (a, b) => a.title.localeCompare(b.title),
    new:   (a, b) => b.date.localeCompare(a.date),
    old:   (a, b) => a.date.localeCompare(b.date),
    big:   (a, b) => b.size - a.size
  }[sort];
  list.sort(cmp);
  document.documentElement.style.setProperty('--cw', $('#size').value + 'px');
  $('#count').textContent = list.length === all.length ? plural(all.length, 'file', 'files') : `${list.length} of ${plural(all.length, 'file', 'files')}`;
  $('#grid').innerHTML = list.length ? list.map(d => `
    <div class="card" data-i="${d.i}" title="${esc(d.file)}">
      <div class="thumb">
        ${d.img ? `<img loading="lazy" src="${esc(d.img)}" alt="">` : `<div class="noimg">${d.err ? 'Could not read the file' : 'No thumbnail in this file'}</div>`}
        <div class="badges">${d.sliced ? '<span class="badge g">sliced</span>' : ''}${d.plates > 1 ? `<span class="badge">${d.plates} plates</span>` : ''}</div>
      </div>
      <div class="info">
        <div class="title">${esc(d.title)}</div>
        ${d.title !== d.name.replace(/(\.gcode)?\.3mf$/i, '') ? `<div class="file">${esc(d.name)}</div>` : ''}
        <div class="meta">${[d.designer && esc(d.designer), d.size + ' MB', d.date.slice(0, 10)].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`).join('') : '<div id="empty">Nothing matches your search.</div>';
  try { localStorage.setItem('g3mf_size', $('#size').value); localStorage.setItem('g3mf_sort', sort); } catch (e) {}
}
['q', 'dir', 'sort', 'size'].forEach(id => $('#' + id).addEventListener('input', render));
$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openLb(+c.dataset.i); });

// details view
let cur = null, ci = 0;
function openLb(i) {
  cur = DATA[i]; ci = 0;
  const d = cur;
  $('#lbPanel').innerHTML = `
    <button id="close" title="Close (Esc)">✕</button>
    <h2>${esc(d.title)}</h2>
    ${d.profile ? `<div class="row"><span class="k">Profile:</span> ${esc(d.profile)}</div>` : ''}
    ${d.designer ? `<div class="row"><span class="k">Designer:</span> ${esc(d.designer)}</div>` : ''}
    <div class="row"><span class="k">File:</span> ${esc(d.name)}</div>
    <div class="row"><span class="k">Size:</span> ${d.size} MB · <span class="k">modified:</span> ${esc(d.date)}</div>
    ${d.plates ? `<div class="row"><span class="k">Plates:</span> ${d.plates}${d.sliced ? ' · sliced file (ready to print)' : ''}</div>` : ''}
    <div class="row path">${esc(fullPath(d))}</div>
    <div class="btns">
      <button id="openFile" class="primary">Open in Bambu Studio</button>
      <button id="copyPath">Copy path</button>
      <button id="delFile" class="danger">Delete</button>
    </div>
    <div class="hint">“Open” and “Delete” work after running <b>Install Buttons.bat</b> once on this computer. “Delete” moves the file to the gallery’s Trash folder.</div>
    ${d.err ? `<div class="row" style="color:#e55">Error: ${esc(d.err)}</div>` : ''}
    ${d.desc ? `<div class="row k">Description</div><div class="desc">${esc(d.desc)}</div>` : ''}`;
  $('#close').onclick = closeLb;
  $('#copyPath').onclick = () => copy(fullPath(d));
  $('#openFile').onclick = () => { runAction('open', d); toast('Opening in Bambu Studio…'); };
  $('#delFile').onclick = () => { runAction('delete', d); toast('Confirm the deletion in the Windows dialog'); watchDeleted(); };
  $('#strip').innerHTML = d.imgs.map((m, k) => `<figure data-k="${k}"><img src="${esc(m.src)}" alt="">${esc(m.label)}</figure>`).join('');
  $('#strip').style.display = d.imgs.length > 1 ? 'flex' : 'none';
  $('#lb').classList.add('on');
  // the cover is small - start with a photo when there is one
  showImg(Math.max(0, d.imgs.findIndex(m => m.label === 'Photo')));
}
function showImg(k) {
  const imgs = cur.imgs;
  if (!imgs.length) { $('#lbImg').removeAttribute('src'); $('#lbImg').style.display = 'none'; $('#prev').style.display = $('#next').style.display = 'none'; return; }
  ci = (k + imgs.length) % imgs.length;
  $('#lbImg').style.display = '';
  $('#lbImg').src = imgs[ci].src;
  $('#prev').style.display = $('#next').style.display = imgs.length > 1 ? '' : 'none';
  document.querySelectorAll('#strip figure').forEach(f => f.classList.toggle('cur', +f.dataset.k === ci));
}
function closeLb() { $('#lb').classList.remove('on'); cur = null; }
$('#prev').onclick = e => { e.stopPropagation(); showImg(ci - 1); };
$('#next').onclick = e => { e.stopPropagation(); showImg(ci + 1); };
$('#strip').addEventListener('click', e => { const f = e.target.closest('figure'); if (f) showImg(+f.dataset.k); });
$('#lbMain').addEventListener('click', e => { if (e.target.id === 'lbMain') closeLb(); });
document.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') showImg(ci - 1);
  else if (e.key === 'ArrowRight') showImg(ci + 1);
});

// "Open" and "Delete" are handled by a small Windows helper (gallery3mf: protocol)
function runAction(action, d) {
  let url = 'gallery3mf:' + action + '?f=' + encodeURIComponent(fullPath(d));
  if (action === 'delete') url += '&g=' + encodeURIComponent(GAL);
  location.href = url;
}
// after a delete the helper appends the path to deleted.js - load it and hide the card
const DELETED = new Set();
function loadDeleted() {
  const s = document.createElement('script');
  s.charset = 'utf-8';
  s.src = 'deleted.js?' + Date.now();
  s.onload = s.onerror = () => {
    s.remove();
    const before = DELETED.size;
    (window.DELETED_FILES || []).forEach(p => DELETED.add(p));
    window.DELETED_FILES = [];
    if (DELETED.size !== before) {
      if (cur && DELETED.has(fullPath(cur))) { closeLb(); toast('File moved to Trash'); }
      render();
    }
  };
  document.head.appendChild(s);
}
let watchTimer = null;
function watchDeleted() {
  clearInterval(watchTimer);
  let n = 0;
  watchTimer = setInterval(() => { loadDeleted(); if (++n > 60) clearInterval(watchTimer); }, 1500);
}

function copy(text) {
  const done = () => toast('Path copied');
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 1600); }

render();
loadDeleted();
</script>
</body>
</html>
